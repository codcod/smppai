# Attach the AsciiDoc user manual (built with snowball) to a GitHub release.
# GitHub-only: this workflow relies on `gh` and the `release` event, both specific
# to GitHub — there is no equivalent step here for other forges.
#
# Triggers on a published release, but GitHub suppresses that event for releases
# created with GITHUB_TOKEN — which is how semantic-release publishes ours — so
# release.yml also calls this workflow directly after a release. Run it by hand
# (workflow_dispatch) to backfill a release that is missing its manual. The manual
# is not the release, so a broken manual build never blocks or unpublishes it.
name: docs-release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the manual to (e.g. v0.9.1)
        required: true

permissions:
  contents: write

jobs:
  attach-manual:
    runs-on: ubuntu-latest
    steps:
      # Check out the tagged commit with history so snowball's git-describe
      # revision matches the release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      # `brew update` first: a preinstalled runner image's Homebrew snapshot can
      # lag behind the tap's bottle metadata, which otherwise only fails on fresh
      # runners and not on an already-updated developer machine. Ubuntu runners
      # ship Homebrew but keep it off PATH, so put it there for later steps too.
      - name: Install snowball
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew update --quiet
          brew install codcod/tap/snowball
          snowball setup

      # A broken or missing docs source must never block the release: this step
      # is allowed to fail without failing the workflow.
      - name: Build user manual
        continue-on-error: true
        run: snowball build -o dist/docs

      - name: Attach user manual to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          existing=(dist/docs/*.pdf dist/docs/*.epub)
          if [ ${#existing[@]} -eq 0 ]; then
            echo "::warning::Release $TAG has no user manual attached — the build step failed" \
              "or produced nothing; see the 'Build user manual' step's log."
            exit 0
          fi
          gh release upload "$TAG" "${existing[@]}" --clobber
